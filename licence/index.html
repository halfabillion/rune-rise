<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120c2c">
<title>Rune Rise — stack, fuse, ascend</title>
<meta name="description" content="Rune Rise: a one-thumb stacking and fusing puzzle. Stack matching rune stones, fuse five into the next tier, and keep the pillars from overflowing.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script>window.RR_BUILD={target:"licence",ads:false,shop:false,shareLink:false};</script>

</head>
<body>
<div id="app">
  <canvas id="cv" aria-label="Game board"></canvas>

  <header id="hud">
    <button id="btnPause" class="hbtn" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button>
    <div id="goal">
      <div id="goalTop"><span id="goalLbl">LEVEL 1</span><span id="dealsLeft"></span></div>
      <div id="goalMain"><span id="goalTxt"></span></div>
      <div id="goalBar"><i id="goalFill"></i></div>
    </div>
    <button id="btnShards" class="pill" aria-label="Shards"><i class="gem"></i><span id="shards">0</span><b id="shardPlus">+</b></button>
  </header>

  <footer id="bar">
    <button id="btnUndo" class="tool" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 7H4V2M4.5 7.5A8 8 0 1 1 4 13" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><em id="undoTag"></em></button>
    <button id="btnDeal" class="deal" aria-label="Deal new stones"><span id="dealTxt">DEAL</span><small id="dealSub"></small></button>
    <button id="btnShatter" class="tool" aria-label="Shatter booster"><svg viewBox="0 0 24 24"><path d="M12 2l2.2 6.3L20.5 6l-3.6 5.6L22 14l-6.4.7L16 21l-4-4.8L8 21l.4-6.3L2 14l5.1-2.4L3.5 6l6.3 2.3z"/></svg><em id="shatterTag"></em></button>
  </footer>

  <div id="coach" aria-hidden="true"><div id="hand"></div><div id="bubble"></div></div>
  <div id="toast" role="status"></div>
  <div id="flash"></div>

  <!-- main menu -->
  <section id="menu" class="overlay show">
    <div class="menuwrap">
      <div class="logo"><div class="stone s1">1</div><div class="stone s2">2</div><div class="stone s3">3</div></div>
      <h1>RUNE <b>RISE</b></h1>
      <button id="btnPlay" class="btn primary big"><span id="playLbl">Play</span><small id="playSub"></small></button>
      <div class="modes">
        <button id="btnEndless" class="mode"><b>Endless</b><small id="endlessSub">Best 0</small></button>
        <button id="btnDaily" class="mode"><b>Daily Rune</b><small id="dailySub">#1</small></button>
      </div>
      <div class="iconrow">
        <button id="btnLevels" class="ibtn" aria-label="Levels"><svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg><span>Levels</span></button>
        <button id="btnShop" class="ibtn" aria-label="Shop"><svg viewBox="0 0 24 24"><path d="M12 2l7 7-7 13L5 9z"/></svg><span>Shop</span></button>
        <button id="btnSettings" class="ibtn" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm9 4.7v-2.4l-2.5-.6a7 7 0 0 0-.7-1.7l1.3-2.2-1.7-1.7-2.2 1.3a7 7 0 0 0-1.7-.7L13.2 3h-2.4l-.6 2.5a7 7 0 0 0-1.7.7L6.3 4.9 4.6 6.6l1.3 2.2a7 7 0 0 0-.7 1.7L2.7 11v2.4l2.5.6c.2.6.4 1.2.7 1.7l-1.3 2.2 1.7 1.7 2.2-1.3c.5.3 1.1.5 1.7.7l.6 2.5h2.4l.6-2.5c.6-.2 1.2-.4 1.7-.7l2.2 1.3 1.7-1.7-1.3-2.2c.3-.5.5-1.1.7-1.7z"/></svg><span>Settings</span></button>
      </div>
    </div>
  </section>

  <section id="levels" class="overlay sheet">
    <div class="card"><h2>Levels</h2><div id="levelGrid"></div><button class="btn ghost" data-close>Close</button></div>
  </section>

  <section id="pause" class="overlay">
    <div class="card"><h2>Paused</h2>
      <button id="btnResume" class="btn primary big">Resume</button>
      <button id="btnRestart" class="btn secondary">Restart</button>
      <button id="btnPauseSettings" class="btn ghost">Settings</button>
      <button id="btnHome" class="btn ghost">Main menu</button>
    </div>
  </section>

  <section id="settings" class="overlay">
    <div class="card"><h2>Settings</h2>
      <div id="toggles"></div>
      <button id="btnTutorial" class="btn ghost">Replay tutorial</button>
      <button id="btnRestore" class="btn ghost">Restore purchases</button>
      <button class="btn secondary" data-close>Done</button>
    </div>
  </section>

  <section id="result" class="overlay">
    <div class="card result">
      <div id="resStars"></div>
      <h2 id="resTitle"></h2>
      <div id="resBig" class="bignum"></div>
      <div id="resMeta" class="meta"></div>
      <div id="resReward" class="reward"></div>
      <div id="resBtns"></div>
      <pre id="shareTxt"></pre>
    </div>
  </section>

  <section id="shop" class="overlay sheet">
    <div class="card"><h2>Shop</h2>
      <div id="shopList"></div>
      <button id="btnFreeShards" class="btn secondary">Free 25 <i class="gem"></i> <em class="ad">AD</em></button>
      <button class="btn ghost" data-close>Close</button>
    </div>
  </section>
</div>
<script src="ads.js"></script>
<script src="core.js"></script>
<script src="game.js"></script>
</body>
</html>
